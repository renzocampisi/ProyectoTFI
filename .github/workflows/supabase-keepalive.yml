name: Supabase keepalive

# Supabase pausa proyectos free tier tras 7 días sin actividad. Este workflow
# pega un GET liviano a la REST API un par de veces por semana para que el
# proyecto nunca llegue a esos 7 días, sin depender de que alguien esté
# programando activamente ni de que el backend en Fly.io esté despierto
# (Fly también escala a cero, así que un cron adentro del backend no sirve).
#
# Usa la anon key pública (la misma que ya viaja en el bundle del frontend,
# no es secreta) contra una tabla chica de solo lectura. Igual se lee de un
# GitHub Secret en vez de hardcodearla en el workflow, para no dejar nada
# parecido a una credencial en el historial de git.
#
# Secrets necesarios en el repo (Settings → Secrets and variables → Actions):
#   SUPABASE_URL        → https://elxmkqascjsyoakedlqf.supabase.co
#   SUPABASE_ANON_KEY    → la misma que VITE_SUPABASE_ANON_KEY del frontend

on:
  schedule:
    - cron: '0 9 * * 1,4' # lunes y jueves 09:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Supabase REST API
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/categorias?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "HTTP status: $status"
          if [ "$status" -ge 400 ]; then
            echo "::error::Supabase respondió $status"
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
